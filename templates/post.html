{% extends "layout.html" %} {% block content %}
<div class="blog-post">
  <div class="blog-top">
    <img
      src="{{ url_for('static', filename='images/' + user['image_file']) }}"
      class="img-post"
    />
    <span class="author-name"><a href="{{url_for('user_posts', username=user['username'])}}">{{user['username'].title()}}</a></span>
    |
    <p class="date-posted">{{post['date_posted'].strftime("%Y-%m-%d")}}</p>
    {% if post['author_id'] == current_user.id %}
    <div class="user-options">
      <a href="{{url_for('update_post', post_id=post['id'])}}" class="update-icon"
        ><i class="fa-solid fa-pen"></i
      ></a>
      <a href="{{ url_for('delete_post', post_id=post['id'])}}" id="delete-icon" class="delete-icon"><i class="fa-solid fa-trash"></i
      ></a>
    </div>
    {% endif %}
  </div>
  <div class="line-sep"></div>
  <div class="blog-content">
    <h4>{{post.title}}</h4>
    <p>{{post.content}}</p>
  </div>
</div>
{% endblock content %}
