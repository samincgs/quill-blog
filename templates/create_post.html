{% from 'macros.html' import form_item_with_errors %}
{% extends "layout.html" %} {% block content %}
<div class="form-group">
  <h1 class="form-title">{{form_title}}</h1>
  <form method="POST" action="">
    {{ form.hidden_tag() }}
    <!-- Title Form -->
    {{ form_item_with_errors(form.title) }}
    <!-- Content Form -->
    {{ form_item_with_errors(form.content) }}
    <!-- Form Button -->
    {{form.submit(class='btn btn-signup')}}
  </form>
</div>
{% endblock content %}
